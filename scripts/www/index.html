<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <title>随手记·日常小账本</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="navbar">
      <div class="app-title" id="appTitleWrap">
        <div class="app-title__display" id="appTitleDisplay">
          <h1 class="app-title__text" id="appTitleText" title="点击修改名称">随手记·日常小账本</h1>
          <button type="button" class="app-title__edit" id="appTitleEditBtn" aria-label="修改账本名称">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
        <input
          type="text"
          class="app-title__input"
          id="appTitleInput"
          maxlength="24"
          placeholder="输入账本名称"
          aria-label="账本名称"
          hidden
        />
      </div>
      <div class="theme-picker">
        <label for="themeSelect" class="theme-picker__label" aria-hidden="true">🎨</label>
        <select id="themeSelect" class="theme-picker__select" aria-label="主题配色">
          <option value="blue">活力蓝</option>
          <option value="orange">拂晓橙</option>
          <option value="green">极光绿</option>
          <option value="dark">深夜模式</option>
        </select>
      </div>
    </header>

    <main class="main">
      <!-- 【明细页】看板 + 记一笔 + 历史明细 -->
      <div class="page-panel is-active" id="pageDetail" role="tabpanel" aria-labelledby="tabDetail">
        <section class="dashboard" aria-label="数据看板">
          <div class="card card-income">
            <span class="card-label">本月总收入</span>
            <span class="card-value" id="monthIncome">¥0.00</span>
          </div>
          <div class="card card-expense">
            <span class="card-label">本月总支出</span>
            <span class="card-value" id="monthExpense">¥0.00</span>
          </div>
          <div class="card card-today">
            <span class="card-label">本日总支出</span>
            <span class="card-value" id="todayExpense">¥0.00</span>
          </div>
          <div class="card card-balance">
            <span class="card-label">账户净结余</span>
            <span class="card-value" id="netBalance">¥0.00</span>
          </div>
        </section>

        <section class="form-section">
          <h2 class="section-title">记一笔</h2>

          <div class="type-tabs" role="tablist" aria-label="账目类型">
            <button type="button" class="type-tab type-tab--expense is-active" data-type="expense" role="tab" aria-selected="true">支出</button>
            <button type="button" class="type-tab type-tab--income" data-type="income" role="tab" aria-selected="false">收入</button>
          </div>

          <form id="recordForm" class="record-form" novalidate>
            <div class="form-group">
              <label for="amount">金额（元）</label>
              <input
                type="text"
                id="amount"
                name="amount"
                class="amount-input"
                placeholder="点击输入金额"
                readonly
                inputmode="none"
                autocomplete="off"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="category">分类</label>
                <select id="category" name="category" required></select>
              </div>
              <div class="form-group">
                <label for="date">日期</label>
                <input type="date" id="date" name="date" required />
              </div>
            </div>

            <div class="form-group">
              <label for="note">备注（选填）</label>
              <input type="text" id="note" name="note" placeholder="例如：午餐、出差报销..." maxlength="50" />
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">记一笔</button>
          </form>
        </section>

        <section class="history-section">
          <div class="history-header">
            <h2 class="section-title">历史账目明细</h2>
            <div class="history-meta">
              <span class="record-count" id="recordCount">共 0 笔</span>
              <span class="record-sum" id="recordSum">累计金额：¥0.00</span>
            </div>
          </div>

          <div class="history-filters">
            <div class="history-filter">
              <label for="historyFilter" class="history-filter__label">类型筛选</label>
              <select id="historyFilter" class="history-filter__select" aria-label="按分类筛选历史账单">
                <option value="all">📋 全部类型</option>
              </select>
            </div>
            <div class="history-filter">
              <label for="yearFilter" class="history-filter__label">年份筛选</label>
              <select id="yearFilter" class="history-filter__select" aria-label="按年份筛选历史账单">
                <option value="all">全部年份</option>
              </select>
            </div>
            <div class="history-filter">
              <label for="monthFilter" class="history-filter__label">月份筛选</label>
              <select id="monthFilter" class="history-filter__select" aria-label="按月份筛选历史账单">
                <option value="all">全部月份</option>
              </select>
            </div>
          </div>

          <ul id="recordList" class="record-list">
            <li class="empty-tip" id="emptyTip">暂无记录，记一笔开始吧～</li>
          </ul>
        </section>
      </div>

      <!-- 【图表页】饼图 + 折线图 -->
      <div class="page-panel" id="pageCharts" role="tabpanel" aria-labelledby="tabCharts" hidden>
        <section class="stats-section stats-section--page">
          <h2 class="section-title stats-page-title">看我把钱花哪了</h2>
          <p class="stats-desc">支出分类占比（已报销的公务支出不计入）</p>

          <div class="period-tabs" role="tablist" aria-label="饼图统计周期">
            <button type="button" class="period-tab is-active" data-period="week">按周查看</button>
            <button type="button" class="period-tab" data-period="month">按月查看</button>
            <button type="button" class="period-tab" data-period="quarter">按季度查看</button>
            <button type="button" class="period-tab" data-period="year">按年度查看</button>
          </div>

          <div class="chart-wrap chart-wrap--pie">
            <canvas id="expenseChart" aria-label="支出分类饼状图"></canvas>
            <p class="chart-empty" id="chartEmpty" hidden>当前筛选条件暂无数据</p>
          </div>

          <div class="trend-section">
            <h3 class="trend-title">收入支出走势</h3>
            <div class="trend-tabs" role="tablist" aria-label="走势图周期">
              <button type="button" class="trend-tab is-active" data-trend="week">周（近7天）</button>
              <button type="button" class="trend-tab" data-trend="month">月（近30天）</button>
              <button type="button" class="trend-tab" data-trend="year">年（近12月）</button>
            </div>
            <div class="chart-wrap chart-wrap--line">
              <canvas id="trendChart" aria-label="收入支出折线图"></canvas>
              <p class="chart-empty" id="trendChartEmpty" hidden>当前筛选条件暂无数据</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 3.5 底部导航（Bottom Navigation） -->
  <nav class="bottom-nav" role="tablist" aria-label="主页面切换">
    <button type="button" class="bottom-nav__item is-active" data-page="detail" role="tab" aria-selected="true" id="tabDetail">
      <span class="bottom-nav__icon" aria-hidden="true">📝</span>
      <span class="bottom-nav__label">账目明细</span>
    </button>
    <button type="button" class="bottom-nav__item" data-page="charts" role="tab" aria-selected="false" id="tabCharts">
      <span class="bottom-nav__icon" aria-hidden="true">📊</span>
      <span class="bottom-nav__label">数据图表</span>
    </button>
  </nav>

  <!-- 编辑账单弹窗 -->
  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="editModalTitle" aria-modal="true">
      <div class="modal__header">
        <h3 class="modal__title" id="editModalTitle">编辑账单</h3>
        <button type="button" class="modal__close" id="editModalClose" aria-label="关闭">×</button>
      </div>
      <form id="editForm" class="modal__form" novalidate>
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label for="editAmount">金额（元）</label>
          <input
            type="text"
            id="editAmount"
            class="amount-input"
            placeholder="点击输入金额"
            readonly
            inputmode="none"
            autocomplete="off"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editCategory">分类</label>
            <select id="editCategory" required></select>
          </div>
          <div class="form-group">
            <label for="editDate">日期</label>
            <input type="date" id="editDate" required />
          </div>
        </div>
        <div class="form-group">
          <label for="editNote">备注（选填）</label>
          <input type="text" id="editNote" maxlength="50" placeholder="选填" />
        </div>
        <div class="modal__actions">
          <button type="button" class="btn-modal-cancel" id="editCancelBtn">取消</button>
          <button type="submit" class="btn-modal-save">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 自定义金额键盘（避免手机自动弹出系统键盘） -->
  <div class="num-keypad-overlay" id="numKeypadOverlay" hidden>
    <div class="num-keypad" role="dialog" aria-label="输入金额">
      <div class="num-keypad__header">
        <span class="num-keypad__label">输入金额</span>
        <button type="button" class="num-keypad__close" id="numKeypadClose" aria-label="关闭">×</button>
      </div>
      <div class="num-keypad__display" id="numKeypadDisplay">0.00</div>
      <div class="num-keypad__grid">
        <button type="button" class="num-key" data-key="1">1</button>
        <button type="button" class="num-key" data-key="2">2</button>
        <button type="button" class="num-key" data-key="3">3</button>
        <button type="button" class="num-key" data-key="4">4</button>
        <button type="button" class="num-key" data-key="5">5</button>
        <button type="button" class="num-key" data-key="6">6</button>
        <button type="button" class="num-key" data-key="7">7</button>
        <button type="button" class="num-key" data-key="8">8</button>
        <button type="button" class="num-key" data-key="9">9</button>
        <button type="button" class="num-key num-key--dot" data-key=".">.</button>
        <button type="button" class="num-key" data-key="0">0</button>
        <button type="button" class="num-key num-key--back" data-key="back" aria-label="删除">⌫</button>
      </div>
      <button type="button" class="num-keypad__confirm" id="numKeypadConfirm">确认</button>
    </div>
  </div>

  <!-- 撤销删除 Toast -->
  <div class="undo-toast" id="undoToast" hidden role="status" aria-live="polite">
    <span class="undo-toast__text" id="undoToastText">已删除一笔账目</span>
    <button type="button" class="undo-toast__btn" id="undoBtn">撤销</button>
    <span class="undo-toast__countdown" id="undoCountdown">5s</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
